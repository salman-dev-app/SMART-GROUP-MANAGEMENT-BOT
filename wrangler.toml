name = "devmind-bot"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# DevMind — AI Developer Bot
# Developer: Md Salman Biswas (github.com/salman-dev-app)
# Cloudflare Workers free tier: 100,000 req/day, 10ms CPU/req
# Workers AI free tier: 10,000 neurons/day

[vars]
BOT_USERNAME = "SalmanDevToolsBot"

# KV Namespace for persistent state (language prefs, stats)
# Create with: wrangler kv:namespace create "BOT_KV"
# Then replace the id below with the one from the output
[[kv_namespaces]]
binding = "BOT_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_PREVIEW_ID"

# Workers AI binding — enables env.AI.run() for Llama 3.1 8B (free!)
[ai]
binding = "AI"

# Secrets (set via: wrangler secret put BOT_TOKEN)
#   wrangler secret put BOT_TOKEN
#   wrangler secret put WEBHOOK_SECRET
